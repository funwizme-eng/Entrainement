<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>Mon Entraînement</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #111827; color: #f9fafb; padding-bottom: 90px; }
  header { padding: 14px 16px; background: #1f2937; position: sticky; top: 0; z-index: 5; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  h3 { margin: 0 0 8px; }
  select, button, input { font-size: 16px; border-radius: 10px; border: none; }
  select { width: 100%; padding: 10px; background: #374151; color: #fff; }
  .timers { display: flex; gap: 8px; margin-top: 10px; }
  .timer { flex: 1; background: #111827; border-radius: 10px; padding: 8px; text-align: center; }
  .timer small { display: block; color: #9ca3af; font-size: 11px; }
  .timer b { font-size: 22px; font-variant-numeric: tabular-nums; }
  .btn { padding: 10px 14px; background: #2563eb; color: #fff; font-weight: 600; }
  .btn.green { background: #16a34a; }
  .btn.red { background: #dc2626; }
  .btn.gray { background: #4b5563; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row .btn { flex: 1; }
  .exo { background: #1f2937; margin: 12px; border-radius: 14px; padding: 12px; }
  .exo h3 { margin: 0; font-size: 17px; }
  .exo p { margin: 2px 0 10px; color: #9ca3af; font-size: 13px; }
  .set { display: grid; grid-template-columns: 28px 1fr 1fr 44px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .set span { color: #9ca3af; text-align: center; }
  .set input { width: 100%; padding: 10px; background: #374151; color: #fff; text-align: center; }
  .set button { height: 42px; background: #374151; color: #9ca3af; font-size: 20px; }
  .set.done button { background: #16a34a; color: #fff; }
  .set.done input { background: #14532d; }
  .prev { font-size: 12px; color: #6b7280; margin: 0 0 8px; }
  .hist { margin: 12px; }
  .hist div.item { background: #1f2937; border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 14px; }
  .prog { background: #1f2937; margin: 12px; border-radius: 14px; padding: 12px; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #9ca3af; margin: 8px 0 4px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
  .vide { color: #6b7280; font-size: 14px; padding: 16px 0; text-align: center; }
  svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<header>
  <h1>🏋️ Mon Entraînement</h1>
  <select id="seance"></select>
  <div class="timers">
    <div class="timer"><small>SÉANCE</small><b id="tSeance">00:00</b></div>
    <div class="timer"><small>REPOS</small><b id="tRepos">00:00</b></div>
  </div>
  <div class="row">
    <button class="btn green" id="btnStart">▶ Démarrer</button>
    <button class="btn gray" id="btnRepos">⏱ Repos</button>
    <button class="btn red" id="btnFin">■ Terminer</button>
  </div>
</header>

<div id="liste"></div>

<div class="prog">
  <h3>📈 Progression</h3>
  <select id="progExo"></select>
  <div class="legend">
    <span><i style="background:#3b82f6"></i>Poids max (kg)</span>
    <span><i style="background:#f59e0b"></i>Volume (kg × reps)</span>
  </div>
  <div id="graph"></div>
</div>

<div class="hist" id="hist"></div>

<script>
const PROGRAMME = {
  "Séance 1 – Upper (lundi)": [
    ["Bench Press", 4, "5-6", 120],
    ["Pull-Ups", 4, "6-8", 120],
    ["Standing Overhead Press", 3, "6-8", 120],
    ["Chest-Supported Row", 3, "8-10", 90],
    ["Push-Ups (explosive)", 3, "10-15", 60],
    ["Face Pulls", 3, "12-15", 60],
    ["Hanging Leg Raises", 3, "10-15", 60]
  ],
  "Séance 2 – Lower (mardi)": [
    ["Back Squat", 4, "5-6", 150],
    ["Romanian Deadlift", 4, "6-8", 120],
    ["Bulgarian Split Squat", 3, "8/jambe", 90],
    ["Box Jumps", 3, "5", 90],
    ["Hip Thrust", 3, "8-10", 90],
    ["Standing Calf Raises", 3, "12-15", 60],
    ["Plank", 3, "30-60 s", 60]
  ],
  "Séance 3 – Upper (jeudi)": [
    ["Incline Dumbbell Press", 4, "6-8", 120],
    ["Lat Pulldown (or Chin-Ups)", 4, "8-10", 90],
    ["Single-Arm Dumbbell Row", 3, "8-10/bras", 90],
    ["Dips", 3, "8-12", 90],
    ["Landmine Press", 3, "8/bras", 60],
    ["Hammer Curls", 2, "10-12", 60],
    ["Pallof Press", 3, "10/côté", 60]
  ],
  "Séance 4 – Lower (vendredi)": [
    ["Trap Bar Deadlift", 4, "4-5", 150],
    ["Front Squat", 3, "6-8", 120],
    ["Walking Lunges", 3, "10/jambe", 90],
    ["Kettlebell Swings", 4, "12-15", 60],
    ["Nordic Hamstring Curl (or Leg Curl)", 3, "6-8", 90],
    ["Seated Calf Raises", 3, "12-15", 60],
    ["Ab Wheel Rollout", 3, "8-12", 60]
  ]
};

const $ = id => document.getElementById(id);
let startTime = null, reposEnd = null, reposDefault = 90, tick = null;
const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
const load = k => JSON.parse(localStorage.getItem(k) || 'null');
const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));

// Menu des séances
Object.keys(PROGRAMME).forEach(n => { const o = document.createElement('option'); o.textContent = n; $('seance').appendChild(o); });
$('seance').onchange = render;

// Menu des exercices pour le graphique (sans doublons)
const tousExos = [...new Set(Object.values(PROGRAMME).flat().map(e => e[0]))];
tousExos.forEach(n => { const o = document.createElement('option'); o.textContent = n; $('progExo').appendChild(o); });
$('progExo').onchange = graphique;

function lastWeights(nom) {
  const h = load('historique') || [];
  for (let i = h.length - 1; i >= 0; i--) {
    const e = h[i].exos.find(x => x.nom === nom);
    if (e && e.sets.some(s => s.kg)) return e.sets.filter(s => s.kg).map(s => s.kg + 'kg×' + s.reps).join(' · ');
  }
  return null;
}

function render() {
  const nom = $('seance').value;
  const liste = $('liste');
  liste.innerHTML = '';
  PROGRAMME[nom].forEach(([exo, series, reps, repos]) => {
    const d = document.createElement('div');
    d.className = 'exo';
    const prev = lastWeights(exo);
    d.innerHTML = `<h3>${exo}</h3><p>${series} séries · ${reps} reps · repos ${repos}s</p>` + (prev ? `<div class="prev">Dernière fois : ${prev}</div>` : '');
    for (let s = 0; s < series; s++) {
      const r = document.createElement('div');
      r.className = 'set';
      r.dataset.exo = exo;
      r.dataset.repos = repos;
      r.innerHTML = `<span>${s+1}</span><input type="number" inputmode="decimal" placeholder="kg"><input type="number" inputmode="numeric" placeholder="reps"><button>✓</button>`;
      r.querySelector('button').onclick = () => {
        r.classList.toggle('done');
        if (r.classList.contains('done')) { if (!startTime) demarrer(); lancerRepos(repos); }
      };
      d.appendChild(r);
    }
    liste.appendChild(d);
  });
}

function demarrer() {
  if (startTime) return;
  startTime = Date.now();
  $('btnStart').textContent = '⏸ En cours';
  tick = setInterval(update, 500);
}

function lancerRepos(sec) {
  reposDefault = sec || reposDefault;
  reposEnd = Date.now() + reposDefault * 1000;
}

function update() {
  if (startTime) $('tSeance').textContent = fmt((Date.now() - startTime) / 1000);
  if (reposEnd) {
    const left = Math.ceil((reposEnd - Date.now()) / 1000);
    if (left <= 0) {
      $('tRepos').textContent = '00:00';
      reposEnd = null;
      if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
    } else $('tRepos').textContent = fmt(left);
  }
}

$('btnStart').onclick = demarrer;
$('btnRepos').onclick = () => lancerRepos(reposDefault);

$('btnFin').onclick = () => {
  if (!startTime) return alert('Séance non démarrée.');
  if (!confirm('Terminer et enregistrer la séance ?')) return;
  const exos = {};
  document.querySelectorAll('.set').forEach(r => {
    const [kg, reps] = r.querySelectorAll('input');
    const nom = r.dataset.exo;
    exos[nom] = exos[nom] || { nom, sets: [] };
    if (kg.value || reps.value) exos[nom].sets.push({ kg: kg.value, reps: reps.value, fait: r.classList.contains('done') });
  });
  const h = load('historique') || [];
  h.push({ ts: Date.now(), date: new Date().toLocaleDateString('fr-FR'), seance: $('seance').value, duree: fmt((Date.now() - startTime) / 1000), exos: Object.values(exos) });
  save('historique', h);
  clearInterval(tick); startTime = null; reposEnd = null;
  $('tSeance').textContent = '00:00'; $('tRepos').textContent = '00:00';
  $('btnStart').textContent = '▶ Démarrer';
  render(); histo(); graphique();
};

function histo() {
  const h = (load('historique') || []).slice(-10).reverse();
  $('hist').innerHTML = h.length ? '<h3>Historique</h3>' + h.map(s => `<div class="item"><b>${s.date}</b> – ${s.seance}<br>Durée : ${s.duree}</div>`).join('') : '';
}

// ---------- Graphique de progression ----------
function donneesExo(nom) {
  const h = load('historique') || [];
  const pts = [];
  h.forEach(s => {
    const e = s.exos.find(x => x.nom === nom);
    if (!e) return;
    const sets = e.sets.filter(x => parseFloat(x.kg) > 0 && parseFloat(x.reps) > 0);
    if (!sets.length) return;
    const max = Math.max(...sets.map(x => parseFloat(x.kg)));
    const vol = sets.reduce((t, x) => t + parseFloat(x.kg) * parseFloat(x.reps), 0);
    pts.push({ date: s.date.slice(0, 5), max, vol });
  });
  return pts;
}

function ligne(pts, cle, couleur, W, H, pad) {
  const vals = pts.map(p => p[cle]);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const x = i => pad.l + (pts.length === 1 ? (W - pad.l - pad.r) / 2 : i * (W - pad.l - pad.r) / (pts.length - 1));
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - min) / span);
  let d = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p[cle]).toFixed(1)).join(' ');
  let s = `<path d="${d}" fill="none" stroke="${couleur}" stroke-width="2.5" stroke-linejoin="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p[cle]).toFixed(1)}" r="4" fill="${couleur}"/>`; });
  return { svg: s, min, max, x, y };
}

function graphique() {
  const nom = $('progExo').value;
  const pts = donneesExo(nom).slice(-12);
  if (!pts.length) { $('graph').innerHTML = '<div class="vide">Pas encore de données pour cet exercice.<br>Termine une séance avec des poids pour voir la courbe.</div>'; return; }
  const W = 340, H = 200, pad = { l: 38, r: 38, t: 14, b: 26 };
  const a = ligne(pts, 'max', '#3b82f6', W, H, pad);
  const b = ligne(pts, 'vol', '#f59e0b', W, H, pad);
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let k = 0; k <= 3; k++) {
    const yy = pad.t + (H - pad.t - pad.b) * k / 3;
    svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${yy}" y2="${yy}" stroke="#374151" stroke-width="1"/>`;
  }
  svg += a.svg + b.svg;
  svg += `<text x="${pad.l - 6}" y="${pad.t + 4}" fill="#3b82f6" font-size="11" text-anchor="end">${a.max}</text>`;
  svg += `<text x="${pad.l - 6}" y="${H - pad.b}" fill="#3b82f6" font-size="11" text-anchor="end">${a.min}</text>`;
  svg += `<text x="${W - pad.r + 6}" y="${pad.t + 4}" fill="#f59e0b" font-size="11">${Math.round(b.max)}</text>`;
  svg += `<text x="${W - pad.r + 6}" y="${H - pad.b}" fill="#f59e0b" font-size="11">${Math.round(b.min)}</text>`;
  const pas = Math.ceil(pts.length / 6);
  pts.forEach((p, i) => { if (i % pas === 0 || i === pts.length - 1) svg += `<text x="${a.x(i).toFixed(1)}" y="${H - 8}" fill="#9ca3af" font-size="10" text-anchor="middle">${p.date}</text>`; });
  svg += '</svg>';
  const dernier = pts[pts.length - 1], premier = pts[0];
  let resume = '';
  if (pts.length > 1) {
    const diff = dernier.max - premier.max;
    resume = `<div class="prev" style="margin-top:8px">Poids max : ${premier.max} → ${dernier.max} kg (${diff >= 0 ? '+' : ''}${diff} kg) sur ${pts.length} séances</div>`;
  }
  $('graph').innerHTML = svg + resume;
}

render(); histo(); graphique();
</script>
</body>
</html>
